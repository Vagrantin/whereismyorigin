name: Build Windows Executable

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust with Windows target
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Install MinGW (for linking)
        run: |
          sudo apt update
          sudo apt install -y gcc-mingw-w64 binutils-mingw-w64

      - name: Set up windres
        run: |
          sudo apt install -y mingw-w64

      - name: Build for Windows
        env:
          RUSTFLAGS: -C linker=x86_64-w64-mingw32-gcc
        run: |
          cargo build --release --target x86_64-pc-windows-gnu

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: whereismyorigin-windows
          path: target/x86_64-pc-windows-gnu/release/whereismyorigin.exe
