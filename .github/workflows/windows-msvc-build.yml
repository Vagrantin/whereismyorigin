name: Build and Release Windows Executable (MSVC)

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0, v2.1.3, etc.

jobs:
  build:
    name: Build on Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust (MSVC)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - name: Build release binary for Windows (MSVC)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/x86_64-pc-windows-msvc/release/whereismyorigin.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

