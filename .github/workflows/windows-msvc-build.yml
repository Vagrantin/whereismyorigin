name: Build and Release Windows Executable (MSVC)

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0, v2.1.3, etc.

jobs:
  build:
    name: Build on Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust (MSVC)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - name: Install MSYS2 and MinGW for strip
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-binutils

      - name: Build release binary for Windows (MSVC)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Download and extract UPX
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/latest/download/upx-4.2.1-win64.zip" -OutFile "upx.zip"
          Expand-Archive -Path "upx.zip" -DestinationPath "upx"
        shell: powershell

      - name: Strip and compress binary
        run: |
          C:\msys64\mingw64\bin\strip.exe target/x86_64-pc-windows-msvc/release/whereismyorigin.exe
          ./upx/upx-4.2.1-win64/upx.exe --best --lzma target/x86_64-pc-windows-msvc/release/whereismyorigin.exe
        shell: bash
        
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload binary to GitHub Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/x86_64-pc-windows-msvc/release/whereismyorigin.exe
          asset_name: whereismyorigin
          asset_content_type: application/octet-stream
