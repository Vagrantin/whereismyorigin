name: Build Windows Executable (MSVC)

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    name: Build on Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust (MSVC)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - name: Build release binary for Windows (MSVC)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: whereismyorigin-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/whereismyorigin.exe

